# =====================================================================
# Настройка сжатия для nginx на хостинге voronov-art.ru
#
# Проблема: nginx отдаёт статику (css/js/svg) напрямую, минуя Apache,
# а по умолчанию в nginx gzip_types = text/html. Поэтому HTML сжимается
# (~12 КБ), а main.css уходит покупателю целиком — 102 КБ вместо ~16.
# .htaccess тут не помогает: он работает только для запросов сквозь Apache.
#
# Куда вставить: панель хостинга → раздел настроек nginx (у Beget/Timeweb —
# «Конфигурация nginx» / индивидуальный конфиг) внутрь блока server { }.
# Если хостинг не даёт править конфиг — написать в поддержку с этим файлом.
# =====================================================================

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied any;

# По умолчанию здесь только text/html — добавляем статику сайта
gzip_types
    text/css
    text/javascript
    text/plain
    text/xml
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff2;

# Долгий кеш для версионированной статики (ультимативно решает повторные загрузки)
location ~* ^.+\.(css|js)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
}
